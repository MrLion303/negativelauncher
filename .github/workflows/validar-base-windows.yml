name: Validar base Windows de Negative Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - portabilidad-multiplataforma
    paths:
      - 'Negative Client/**'
      - 'NegativeLauncher.Core/**'
      - '.github/workflows/validar-base-windows.yml'

permissions:
  contents: read

jobs:
  compilar-windows:
    name: Compilar referencia Windows x64
    runs-on: windows-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar SDK de .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Mostrar SDK instalado
        run: dotnet --info

      - name: Restaurar dependencias
        run: dotnet restore "Negative Client/Negative Client/Negative Client.csproj"

      - name: Publicar EXE autocontenido de referencia
        run: >-
          dotnet publish "Negative Client/Negative Client/Negative Client.csproj"
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output "./salida-windows"
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verificar salida de publicación
        shell: pwsh
        run: |
          $exe = Get-ChildItem "./salida-windows" -Filter "*.exe" -File
          if (-not $exe) {
            Write-Error "No se generó el EXE de referencia."
            exit 1
          }
          $exe | ForEach-Object {
            Write-Host "EXE: $($_.Name) | Tamaño: $($_.Length) bytes"
          }
          Get-ChildItem "./salida-windows" -File |
            Select-Object Name, Length | Format-Table -AutoSize

      - name: Guardar EXE de referencia
        uses: actions/upload-artifact@v4
        with:
          name: Negative-Launcher-Referencia-Windows-x64
          path: ./salida-windows/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Guardar manifiesto de compilación
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./manifiesto | Out-Null
          $exe = Get-ChildItem "./salida-windows" -Filter "*.exe" -File | Select-Object -First 1
          $info = [ordered]@{
            commit = "${{ github.sha }}"
            framework = "net10.0-windows"
            runtime = "win-x64"
            selfContained = $true
            singleFile = $true
            executable = $exe.Name
            bytes = $exe.Length
          }
          $info | ConvertTo-Json | Set-Content ./manifiesto/compilacion.json
      - name: Guardar manifiesto como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Negative-Launcher-Manifiesto-Windows
          path: ./manifiesto/compilacion.json
          retention-days: 14