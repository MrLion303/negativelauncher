name: Validar base Windows de Negative Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - portabilidad-multiplataforma
      - portabilidad-fiel-0.1.1
    paths:
      - 'Negative Client/**'
      - 'NegativeLauncher.Core/**'
      - '.github/workflows/validar-base-windows.yml'

permissions:
  contents: read

jobs:
  compilar-windows:
    name: Compilar referencia Windows x64
    runs-on: windows-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar SDK de .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Mostrar SDK instalado
        run: dotnet --info

      - name: Restaurar dependencias
        run: dotnet restore "Negative Client/Negative Client/Negative Client.csproj"

      - name: Publicar EXE autocontenido de referencia
        run: >-
          dotnet publish "Negative Client/Negative Client/Negative Client.csproj"
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output "./salida-windows"
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verificar salida de publicación
        shell: pwsh
        run: |
          $exe = Get-ChildItem "./salida-windows" -Filter "*.exe" -File
          if (-not $exe) {
            Write-Error "No se generó el EXE de referencia."
            exit 1
          }
          $exe | ForEach-Object {
            Write-Host "EXE: $($_.Name) | Tamaño: $($_.Length) bytes"
          }
          Get-ChildItem "./salida-windows" -File |
            Select-Object Name, Length | Format-Table -AutoSize
