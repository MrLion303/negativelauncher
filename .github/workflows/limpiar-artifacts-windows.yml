name: Limpiar artifacts Windows confirmados

on:
  push:
    branches:
      - portabilidad-fiel-0.1.1
    paths:
      - '.github/workflows/limpiar-artifacts-windows.yml'

permissions:
  actions: write

jobs:
  eliminar:
    runs-on: ubuntu-latest
    steps:
      - name: Eliminar solo los dos artifacts Windows aprobados
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for artifact_id in 11830443558 11829999226; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GH_REPOSITORY}/actions/artifacts/${artifact_id}")"
            if [[ "$status" != "204" && "$status" != "404" ]]; then
              echo "Artifact ${artifact_id}: HTTP ${status}" >&2
              exit 1
            fi
          done
