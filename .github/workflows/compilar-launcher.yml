name: Compilar instalador gráfico de Negative Client (prueba)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Negative Client/**'
      - '.github/workflows/compilar-launcher.yml'
      - 'instalador/**'

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar launcher e instalador para pruebas
    runs-on: windows-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Verificar SDK .NET 10
        shell: pwsh
        run: |
          dotnet --list-sdks
          $sdk = dotnet --list-sdks | Where-Object { $_ -match '^10\.' } | Select-Object -First 1
          if (-not $sdk) { throw "El runner de Windows no tiene instalado el SDK .NET 10." }

      - name: Restaurar dependencias
        run: dotnet restore "Negative Client/Negative Client/Negative Client.csproj"

      - name: Publicar launcher con archivos separados
        shell: pwsh
        run: |
          dotnet publish "Negative Client/Negative Client/Negative Client.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "./publicacion" `
            -p:PublishSingleFile=false `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -p:IncludeAllContentForSelfExtract=false `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw "Falló la publicación del launcher." }
          if (-not (Test-Path "./publicacion/Negative Client.exe")) {
            throw "No se encontró Negative Client.exe en la carpeta publicada."
          }
          Write-Host "Tamaño de los archivos sin comprimir:"
          $files = Get-ChildItem "./publicacion" -File -Recurse
          "{0:N1} MB" -f (($files | Measure-Object Length -Sum).Sum / 1MB)

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compilar instalador gráfico comprimido
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "No se encontró el compilador de Inno Setup." }
          & $iscc "/DAppVersion=1.0.1-test.${{ github.run_number }}" "./instalador/NegativeClient.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup no pudo compilar el instalador." }
          $setup = Get-ChildItem "./instalador-prueba" -Filter "*Instalador*.exe" -File
          if (-not $setup) { throw "No se generó el instalador gráfico." }
          Write-Host "Instalador generado:"
          $setup | Select-Object Name, Length | Format-Table -AutoSize

      - name: Subir instalador de prueba
        uses: actions/upload-artifact@v4
        with:
          name: Negative-Client-Instalador-Grafico-Windows-x64-prueba
          path: ./instalador-prueba/*Instalador*.exe
          if-no-files-found: error
          retention-days: 14
