name: Verificar recursos visuales de Linux

on:
  push:
    branches:
      - portabilidad-fiel-0.1.1
    paths:
      - 'Prototipo Avalonia/**'
      - 'Negative Client/Negative Client/Assets/**'
      - '.github/workflows/verificar-recursos-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar-recursos:
    name: Comprobar recursos y rutas sensibles a mayúsculas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Verificar imágenes e iconos del launcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          assets = Path("Negative Client/Negative Client/Assets")
          project = Path("Prototipo Avalonia/NegativeLauncher.AvaloniaPrototype.csproj")
          required = (
              "negativeclient.ico",
              "negativeclient_logo.png",
              "login_bg.png",
              "home_icon.png",
              "negativeclient_bg.png",
              "minecraft_vanilla.png",
          )

          if not assets.is_dir():
              print(f"ERROR: no existe la carpeta de recursos: {assets}")
              sys.exit(1)

          actual_names = {item.name for item in assets.iterdir() if item.is_file()}
          missing = [name for name in required if name not in actual_names]
          if missing:
              print("Faltan recursos o sus nombres no coinciden exactamente en Linux:")
              for name in missing:
                  case_matches = sorted(
                      item for item in actual_names
                      if item.casefold() == name.casefold()
                  )
                  suffix = f" (encontrado: {', '.join(case_matches)})" if case_matches else ""
                  print(f"  - {name}{suffix}")
              sys.exit(1)

          if not project.is_file():
              print(f"ERROR: no existe el proyecto Avalonia: {project}")
              sys.exit(1)

          project_text = project.read_text(encoding="utf-8")
          if "../Negative Client/Negative Client/Assets/**/*" not in project_text:
              print("ERROR: el proyecto no incluye la copia de los recursos originales.")
              sys.exit(1)

          print(f"Correcto: {len(required)} recursos principales existen con el nombre exacto.")
          print("Correcto: el proyecto Avalonia copia los recursos originales al paquete.")

          # Comprobar todas las rutas de Assets usadas por XAML y C#, no solo el conjunto principal.
          source_text = "\n".join(
              path.read_text(encoding="utf-8")
              for path in project.parent.rglob("*")
              if path.is_file() and path.suffix.lower() in {".axaml", ".cs"}
          )

          # Evitar que una modificación futura reintroduzca dependencias de WPF en el port Linux.
          forbidden_references = (
              "System.Windows",
              "PresentationFramework",
              "WindowsBase",
              "Microsoft.Win32.OpenFileDialog",
          )
          incompatible = [reference for reference in forbidden_references if reference in source_text]
          if incompatible:
              print("El proyecto Avalonia contiene referencias exclusivas de Windows/WPF:")
              for reference in incompatible:
                  print(f"  - {reference}")
              sys.exit(1)

          import re
          referenced = set(re.findall(r"""Assets/([A-Za-z0-9_. -]+\.(?:png|ico|jpg|jpeg|webp))""", source_text, re.IGNORECASE))
          all_asset_paths = {
              path.relative_to(assets).as_posix()
              for path in assets.rglob("*")
              if path.is_file()
          }
          missing_references = sorted(name for name in referenced if name not in all_asset_paths)
          if missing_references:
              print("La interfaz referencia recursos inexistentes o con mayúsculas distintas:")
              for name in missing_references:
                  alternatives = sorted(
                      existing for existing in all_asset_paths
                      if existing.casefold() == name.casefold()
                  )
                  suffix = f" (nombre real: {', '.join(alternatives)})" if alternatives else ""
                  print(f"  - Assets/{name}{suffix}")
              sys.exit(1)

          # Verificar firmas y dimensiones básicas para detectar archivos truncados o renombrados.
          import struct
          image_errors = []
          for name in required:
              path = assets / name
              data = path.read_bytes()
              if name.lower().endswith(".png"):
                  if len(data) < 24 or data[:8] != b"\x89PNG\r\n\x1a\n":
                      image_errors.append(f"{name}: no es un PNG válido o está truncado")
                      continue
                  width, height = struct.unpack(">II", data[16:24])
                  if width < 1 or height < 1:
                      image_errors.append(f"{name}: dimensiones PNG inválidas ({width}x{height})")
              elif name.lower().endswith(".ico"):
                  if len(data) < 6 or data[:4] != b"\x00\x00\x01\x00":
                      image_errors.append(f"{name}: cabecera ICO inválida o archivo truncado")
          if image_errors:
              print("Hay recursos gráficos dañados:")
              for error in image_errors:
                  print(f"  - {error}")
              sys.exit(1)

          print(f"Correcto: {len(referenced)} referencias gráficas del código apuntan a archivos existentes.")
          print("Correcto: los recursos principales tienen cabeceras gráficas válidas.")
          PY
