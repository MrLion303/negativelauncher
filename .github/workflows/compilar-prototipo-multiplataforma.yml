name: Compilar Negative Launcher para Linux

on:
  workflow_dispatch:
  push:
    branches:
      - portabilidad-fiel-0.1.1
    paths:
      - 'Prototipo Avalonia/**'
      - 'NegativeLauncher.Core/**'
      - 'NegativeLauncher.Core.Tests/**'
      # El port enlaza servicios de la aplicación WPF; cualquier cambio en ellos
      # puede afectar Linux aunque el archivo esté fuera de NegativeLauncher.Core.
      - 'Negative Client/Negative Client/Services/**'
      - 'Negative Client/Negative Client/Models/**'
      - 'Negative Client/Negative Client/Assets/**'
      - 'Negative Client/Negative Client/Negative Client.csproj'
      - '.github/workflows/compilar-prototipo-multiplataforma.yml'
      - '.github/workflows/publicar-release-multiplataforma.yml'

permissions:
  contents: read

# Si hay varios commits seguidos, conservar solo la compilación del estado más reciente.
concurrency:
  group: linux-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    name: Publicar para ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Verificar eventos de la interfaz Avalonia
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          project = Path("Prototipo Avalonia")
          xaml = "\n".join(path.read_text(encoding="utf-8") for path in project.rglob("*.axaml"))
          code = "\n".join(path.read_text(encoding="utf-8") for path in project.rglob("*.cs"))
          event_names = ("Click", "PointerReleased", "PointerPressed", "TextChanged", "IsCheckedChanged", "SelectionChanged", "KeyDown", "DoubleTapped", "LostFocus", "PropertyChanged", "Opened", "Closed", "ValueChanged", "ScrollChanged", "PointerEntered", "PointerExited", "Tapped")
          pattern = r"\b(?:" + "|".join(event_names) + r")=\"([A-Za-z_][A-Za-z0-9_]*)\""
          handlers = set(re.findall(pattern, xaml))
          missing = sorted(name for name in handlers if re.search(r"\b" + re.escape(name) + r"\s*\(", code) is None)
          if missing:
              print("Hay eventos XAML sin método en el code-behind:")
              print("\n".join(f"  - {name}" for name in missing))
              sys.exit(1)

          main_window_code = "\n".join(
              path.read_text(encoding="utf-8")
              for path in project.glob("MainWindow*.cs")
          )
          event_method_pattern = (
              r"^\s*(?:private|public|protected|internal)\s+"
              r"(?:async\s+)?(?:void|Task|ValueTask)\s+"
              r"([A-Za-z_]\w*(?:_Click|_Changed|_Pressed|_Released|_SelectionChanged|"
              r"_ValueChanged|_Checked|_Closing|_Closed|_Opened|_Tapped|_KeyDown|"
              r"_LayoutUpdated|_Deactivated|_LostFocus|_TextChanged|_PointerEntered|_PointerExited))"
              r"\s*\(([^)]*)\)"
          )
          event_methods = re.findall(event_method_pattern, main_window_code, re.MULTILINE)

          def normalize_event_parameters(parameters):
              normalized = []
              for parameter in parameters.split(","):
                  parameter = parameter.split("=", 1)[0].strip()
                  parameter = re.sub(r"\s+[A-Za-z_]\w*$", "", parameter)
                  normalized.append(parameter)
              return tuple(normalized)

          event_signatures = [
              (name, normalize_event_parameters(parameters))
              for name, parameters in event_methods
          ]
          duplicate_event_methods = sorted({
              name for name, signature in event_signatures
              if event_signatures.count((name, signature)) > 1
          })
          if duplicate_event_methods:
              print("Hay manejadores de eventos duplicados en las partes de MainWindow:")
              print("\n".join(f"  - {name}" for name in duplicate_event_methods))
              sys.exit(1)

          control_names = set(re.findall(r'x:Name="([^"]+)"', xaml))

          # Nombres equivalentes de controles funcionales entre la referencia WPF
          # y Avalonia. Las diferencias de nomenclatura quedan explícitas en vez
          # de perderse silenciosamente durante la migración.
          reference_xaml = Path(
              "Negative Client/Negative Client/MainWindow.xaml"
          ).read_text(encoding="utf-8-sig")
          reference_control_names = set(re.findall(r'x:Name="([^"]+)"', reference_xaml))
          parity_control_map = {
              "HomeButton": "HomeNav",
              "ModpackList": "SidebarInstancesList",
              "AddModpackButton": "ModpacksNav",
              "GalleryButton": "GalleryNav",
              "AccountSettingsButton": "SettingsNav",
              "GallerySelectionModeButton": "GallerySelectionButton",
              "GalleryInstanceFilterComboBox": "GalleryInstanceFilter",
              "GallerySortComboBox": "GallerySortFilter",
              "GalleryStatusText": "GalleryCountText",
              "GalleryItemsControl": "GalleryImagesPanel",
              "GalleryEmptyPanel": "GalleryEmpty",
              "GalleryViewerTitleText": "GalleryViewerTitle",
              "GalleryViewerInfoText": "GalleryViewerDetails",
              "AccountQuickButton": "QuickAccountButton",
              "SelectedModpackText": "HomeSelectedInstanceText",
              "DownloadProgressPanel": "DownloadProgressPanel",
              "DownloadProgressText": "RuntimeGlobalOperationMessage",
              "DownloadProgressTrack": "DownloadProgressTrack",
              "DownloadProgressFill": "RuntimeGlobalOperationProgress",
              "DownloadProgressScaleTransform": "RuntimeGlobalOperationProgress",
              "PlayButton": "HomePlayButton",
              "OperationActionPanel": "RuntimeGlobalOperationPanel",
              "OperationStopButton": "RuntimeGlobalOperationStopButton",
              "OperationPauseResumeButton": "RuntimeGlobalOperationPauseResumeButton",
              "StatusText": "GameStatus",
              "InstanceOptionsButton": "HomeInstanceOptionsButton",
              "TopLeftLogoImage": "BrandLogo",
              "TopLeftLogoFallbackText": "BrandLogoFallback",
              "HomeBackgroundImage": "HomeBackgroundImage",
              "HomeBackgroundOverlay": "HomeBackgroundOverlay",
              "InstanceBackgroundImage": "HomeBackgroundImage",
              "InstanceBackgroundOverlay": "HomeBackgroundOverlay",
              "LauncherVersionText": "LauncherVersionText",
              "GalleryDeleteSelectedText": "GalleryDeleteSelectedButton",
              "GalleryViewRoot": "GalleryPage",
              "GalleryRefreshButton": "GalleryRefreshButton",
              "GalleryDeleteSelectedButton": "GalleryDeleteSelectedButton",
              "GalleryViewerOverlay": "GalleryViewerOverlay",
              "GalleryViewerDeleteButton": "GalleryViewerDeleteButton",
              "GalleryViewerImage": "GalleryViewerImage",
              "AccountQuickRoot": "AccountQuickRoot",
              "QuickCurrentHeadFallback": "QuickCurrentHeadFallback",
              "QuickCurrentHeadImage": "QuickCurrentHeadImage",
              "QuickCurrentAccountNameText": "QuickCurrentAccountNameText",
              "AccountQuickPopup": "AccountQuickPopup",
              "QuickAccountsListPanel": "QuickAccountsListPanel",
              "QuickAddAccountButton": "QuickAddAccountButton",
              "MicrosoftWarningBorder": "HomeAccountWarningBorder",
              "UpdateAvailableBorder": "UpdateAvailableBorder",
              "MainCenterPanel": "MainCenterPanel",
              "MainTitleText": "MainTitleText",
              "DeveloperVersionPanel": "DeveloperVersionPanel",
              "DeveloperVersionComboBox": "DeveloperVersionComboBox",
              "DeveloperShowSnapshotsCheckBox": "DeveloperShowSnapshotsCheckBox",
              "DeveloperShowBetasCheckBox": "DeveloperShowBetasCheckBox",
              "LoginGate": "LoginGate",
              "LoginMicrosoftButton": "LoginMicrosoftButton",
              "LoginOptionsPanel": "LoginOptionsPanel",
              "ChooseOfflineLoginButton": "ChooseOfflineLoginButton",
              "OfflineLoginPanel": "OfflineLoginPanel",
              "OfflineUsernameBox": "OfflineUsernameBox",
              "LoginOfflineButton": "LoginOfflineButton",
              "BackToLoginOptionsButton": "BackToLoginOptionsButton",
              "LoginStatusText": "LoginStatusText",
          }
          missing_parity_controls = sorted(
              f"{wpf_name} -> {avalonia_name}"
              for wpf_name, avalonia_name in parity_control_map.items()
              if wpf_name not in reference_control_names or avalonia_name not in control_names
          )
          if missing_parity_controls:
              print("Faltan equivalentes explícitos de controles WPF en Avalonia:")
              print("\\n".join(f"  - {name}" for name in missing_parity_controls))
              sys.exit(1)
          print(f"Correcto: {len(parity_control_map)} equivalencias funcionales WPF/Avalonia protegidas.")

          control_properties = "IsVisible|Content|BorderBrush|Background|Foreground|Text|IsEnabled|IsChecked|Children|Bounds|Opacity|Width|Height|Margin|Padding|FontSize|Value|ItemsSource|SelectedItem|SelectedIndex|Source|Effect|CornerRadius|ClipToBounds|IsHitTestVisible|Tag|DataContext|WindowState|Title|Topmost|IsOpen|Watermark|TextWrapping|MaxWidth|MinWidth|MaxHeight|MinHeight|IsExpanded|TextDecorations|HorizontalAlignment|VerticalAlignment"
          control_refs = set(re.findall(r"\b([A-Z][A-Za-z0-9_]*)\.(" + control_properties + r")\b", code))
          # La expresión regular también encuentra namespaces, tipos de Avalonia
          # y propiedades de geometría. No deben confundirse con nombres de controles.
          non_control_receivers = {
              "Avalonia", "Bounds", "Layout", "Media", "PixelSize",
              "Shape", "SizeToContent", "System"
          }
          missing_controls = sorted(
              name for name, _ in control_refs
              if name not in control_names and name not in non_control_receivers
          )
          if missing_controls:
              print("El code-behind referencia controles que no existen en XAML:")
              print("\n".join(f"  - {name}" for name in missing_controls))
              sys.exit(1)
          print(f"Correcto: {len(handlers)} manejadores XAML y referencias a controles validados.")

          # El fondo personalizado de una instancia de WPF debe conservar su equivalente en Avalonia:
          # caché por ID, protección frente a selecciones obsoletas, overlay y restauración del panel.
          instance_background_contract = (
              "private async Task LoadSelectedInstanceBackgroundAsync(InstalledInstance? instance)",
              "instance.BackgroundFileId",
              "generation != _backgroundLoadGeneration",
              "HomeBackgroundImage.Source = image;",
              "HomeBackgroundOverlay.IsVisible = true;",
              "MainCenterPanel.IsVisible = false;",
              "private void ClearHomeBackgroundImage()",
          )
          missing_instance_background_contract = [
              token for token in instance_background_contract
              if token not in main_window_code
          ]
          if missing_instance_background_contract:
              print("El fondo personalizado de instancias perdió parte de su contrato funcional:")
              print("\\n".join(f"  - {token}" for token in missing_instance_background_contract))
              sys.exit(1)
          print("Correcto: fondo personalizado de instancias y protección de selección validados.")

          # Protege el drenaje de stdout/stderr y el procesamiento por lotes de la consola.
          console_source = (project / "GameConsoleWindow.axaml.cs").read_text(encoding="utf-8")
          output_helper_source = (project / "MainWindow.ProcessOutput.cs").read_text(encoding="utf-8")
          required_console_contract = (
              "ConcurrentQueue<string>",
              "MaximumConsoleCharacters",
              "MaximumPendingConsoleLineCharacters = 16384",
              "[línea truncada]",
              "private void FlushPendingLines()",
              "Interlocked.Exchange(ref _flushScheduled, 0)",
              "while (pending > 5000",
          )
          missing_console_contract = [
              token for token in required_console_contract
              if token not in console_source
          ]
          if missing_console_contract:
              print("La consola no conserva el contrato de procesamiento por lotes:")
              print("\\n".join(f"  - {token}" for token in missing_console_contract))
              sys.exit(1)
          if main_window_code.count("StartMinecraftOutputDrain(process);") != 2:
              print("Las dos rutas de lanzamiento deben usar el mismo drenaje de salida.")
              sys.exit(1)
          if "process.BeginOutputReadLine();" not in output_helper_source or "process.BeginErrorReadLine();" not in output_helper_source:
              print("El drenaje compartido debe consumir stdout y stderr.")
              sys.exit(1)

          normal_launch_source = (project / "MainWindow.axaml.cs").read_text(encoding="utf-8")
          launch_anchor = "Process process = await _runtimeService.LaunchAsync(instance, _preferences, session);"
          launch_start = normal_launch_source.find(launch_anchor)
          state_save = normal_launch_source.find(
              "await _launcherStateService.SetLastPlayedInstanceIdAsync(instance.Id);",
              launch_start
          )
          console_attach = normal_launch_source.find(
              "new GameConsoleWindow(process, instance.Name)",
              launch_start
          )
          output_drain = normal_launch_source.find(
              "StartMinecraftOutputDrain(process);",
              launch_start
          )
          if launch_start < 0 or state_save < 0 or min(console_attach, output_drain) < 0:
              print("No se pudo verificar el orden de conexión de la salida en el lanzamiento normal.")
              sys.exit(1)
          if min(console_attach, output_drain) > state_save:
              print("La salida de Minecraft debe conectarse antes de esperar al guardado del estado.")
              sys.exit(1)

          runtime_source = Path(
              "NegativeLauncher.Core/Services/MinecraftRuntimeService.cs"
          ).read_text(encoding="utf-8")
          output_contract = (
              "process.StartInfo.RedirectStandardOutput = preferences.ShowGameConsole;",
              "process.StartInfo.RedirectStandardError = preferences.ShowGameConsole;",
              "if (!process.StartInfo.RedirectStandardOutput &&",
              "if (process.StartInfo.RedirectStandardOutput)",
              "if (process.StartInfo.RedirectStandardError)",
          )
          missing_output_contract = [
              token for token in output_contract
              if token not in runtime_source + "\\n" + output_helper_source
          ]
          if missing_output_contract:
              print("La redirección de salida y el drenaje deben coincidir con la opción de consola:")
              print("\\n".join(f"  - {token}" for token in missing_output_contract))
              sys.exit(1)

          state_service_source = Path(
              "NegativeLauncher.Core/Services/LauncherStateService.cs"
          ).read_text(encoding="utf-8")
          required_state_contract = (
              "LauncherPathRules.ValidateInstanceId(data.LastPlayedInstanceId);",
              "LauncherPathRules.ValidateInstanceId(instanceId);",
          )
          missing_state_contract = [
              token for token in required_state_contract
              if token not in state_service_source
          ]
          if missing_state_contract:
              print("El estado de la última instancia debe validar los IDs al leer y escribir.")
              print("\\n".join(f"  - {token}" for token in missing_state_contract))
              sys.exit(1)

          if 'string.Equals(x.Id, _lastPlayedInstanceId, StringComparison.Ordinal)' not in normal_launch_source:
              print("La selección de la última instancia debe respetar la distinción entre mayúsculas y minúsculas.")
              sys.exit(1)
          print("Correcto: consola, drenaje, redirección y estado seguro de instancia validados.")

          # Una cancelación debe ocurrir antes de modificar archivos. Tras aplicar el ZIP,
          # el manifiesto administrado debe guardarse para no dejar una actualización a medias.
          modpack_source = Path(
              "Negative Client/Negative Client/Services/ModpackInstallerService.cs"
          ).read_text(encoding="utf-8")
          pre_apply_cancel = modpack_source.find("controller.ThrowIfStopped();", modpack_source.find("HashSet<string> newManagedFiles"))
          apply_start = modpack_source.find("if (!Directory.Exists(", pre_apply_cancel)
          metadata_save = modpack_source.find("await SaveManagedFilesAsync(", apply_start)
          post_apply_cancel = modpack_source.find("controller.ThrowIfStopped();", apply_start)
          if min(pre_apply_cancel, apply_start, metadata_save) < 0:
              print("No se pudo validar el punto seguro de cancelación del modpack.")
              sys.exit(1)
          if post_apply_cancel >= 0 and post_apply_cancel < metadata_save:
              print("No debe cancelarse entre aplicar el ZIP y guardar el manifiesto administrado.")
              sys.exit(1)
          managed_save_start = modpack_source.find(
              "private static async Task\n            SaveManagedFilesAsync("
          )
          if managed_save_start < 0:
              print("No se encontró el guardado del manifiesto administrado.")
              sys.exit(1)
          managed_save_source = modpack_source[managed_save_start:managed_save_start + 2400]
          for token in (
              'string temporaryPath =',
              'File.Move(',
              'overwrite: true',
              'File.Delete(temporaryPath)',
          ):
              if token not in managed_save_source:
                  print("El manifiesto administrado debe escribirse atómicamente y limpiar su temporal.")
                  print(f"  - {token}")
                  sys.exit(1)
          print("Correcto: la cancelación del modpack y el guardado atómico del manifiesto están validados.")
          rollback_start = modpack_source.find("catch (Exception updateException)")
          rollback_end = modpack_source.find("// ARCHIVOS ADMINISTRADOS POR NEGATIVE CLIENT", rollback_start)
          rollback_source = modpack_source[rollback_start:rollback_end] if rollback_start >= 0 and rollback_end > rollback_start else ""
          for token in ("var rollbackErrors = new List<Exception>();", "catch (Exception rollbackException)", "rollbackErrors.Insert(0, updateException)", "throw new AggregateException("):
              if token not in rollback_source:
                  print("El rollback del modpack debe intentar restaurar todos los archivos y conservar los errores originales.")
                  print(f"  - {token}")
                  sys.exit(1)
          print("Correcto: la restauración transaccional intenta recuperar todos los archivos y agrega los fallos de rollback.")

          # La versión visible debe proceder del ensamblado, no de una cadena fija.
          avalonia_window_source = Path("Prototipo Avalonia/MainWindow.axaml.cs").read_text(encoding="utf-8")
          required_version_contract = (
              "typeof(MainWindow).Assembly.GetName().Version",
              "currentLauncherVersion.ToString(3)",
              'Title = $"Negative Client {displayedVersion}";',
              'LauncherVersionText.Text = $"Negative Client {displayedVersion}";',
          )
          missing_version_contract = [token for token in required_version_contract if token not in avalonia_window_source]
          if missing_version_contract:
              print("La versión del título y del encabezado debe derivarse de la versión real del ensamblado.")
              print("\\n".join(f"  - {token}" for token in missing_version_contract))
              sys.exit(1)

          # No se considera que dos archivos sean iguales solo por tamaño y fecha:
          # el port conserva SHA-256 para no omitir una actualización válida.
          equivalence_start = modpack_source.find("private static bool FilesAreEquivalent(")
          equivalence_end = modpack_source.find("// CACHÉ DEL PAQUETE", equivalence_start)
          equivalence_source = modpack_source[equivalence_start:equivalence_end] if equivalence_start >= 0 and equivalence_end > equivalence_start else ""
          if equivalence_source.count("SHA256.HashData(") < 2 or "SequenceEqual(" not in equivalence_source:
              print("La comparación de archivos debe verificar el contenido con SHA-256 antes de omitir una copia.")
              sys.exit(1)
          print("Correcto: versión visible derivada del ensamblado y comparación de contenido SHA-256 validadas.")

          # La extracción debe bloquear enlaces simbólicos existentes dentro del destino:
          # una ruta interna puede resolver físicamente fuera del directorio de modpacks.
          archive_safety_source = Path(
              "NegativeLauncher.Core/Services/ModpackArchiveSafety.cs"
          ).read_text(encoding="utf-8")
          required_archive_safety = (
              "RejectReparsePoint(destinationRoot);",
              "RejectReparsePointPath(destinationRoot, destinationPath);",
              "info.LinkTarget is not null",
              "FileAttributes.ReparsePoint",
          )
          missing_archive_safety = [
              token for token in required_archive_safety
              if token not in archive_safety_source
          ]
          if missing_archive_safety:
              print("La extracción de ZIP debe rechazar enlaces y puntos de reanálisis en el destino.")
              print("\\n".join(f"  - {token}" for token in missing_archive_safety))
              sys.exit(1)
          print("Correcto: extracción ZIP protegida frente a escapes mediante enlaces.")

          required_archive_limits = (
              "MaxArchiveEntries = 100_000",
              "MaxEntryUncompressedBytes = 2L * 1024 * 1024 * 1024",
              "MaxArchiveUncompressedBytes = 8L * 1024 * 1024 * 1024",
              "ValidateArchiveLimits(archive);",
              "using Stream source = entry.Open();",
              "while ((bytesRead = source.Read(buffer, 0, buffer.Length)) > 0)",
              "cancellationToken.ThrowIfCancellationRequested();",
              "destination.Write(buffer, 0, bytesRead);",
              "entryBytes != entry.Length",
              "MaxArchiveUncompressedBytes - extractedBytes",
              "FileOptions.SequentialScan",
          )
          missing_archive_limits = [
              token for token in required_archive_limits
              if token not in archive_safety_source
          ]
          if missing_archive_limits:
              print("La extracción ZIP debe limitar entradas y tamaño descomprimido.")
              print("\\n".join(f"  - {token}" for token in missing_archive_limits))
              sys.exit(1)

          archive_tests_source = Path(
              "NegativeLauncher.Core.Tests/Program.cs"
          ).read_text(encoding="utf-8")
          if "linkedRootRejected" not in archive_tests_source:
              print("Falta la prueba de rechazo de una raíz de extracción enlazada.")
              sys.exit(1)
          print("Correcto: límites anti-ZIP-bomb y prueba de raíz enlazada presentes.")

          installer_source = Path(
              "Negative Client/Negative Client/Services/ModpackInstallerService.cs"
          ).read_text(encoding="utf-8-sig")
          required_installer_delegation = (
              "ModpackArchiveSafety.ValidateZip(zipPath);",
              "ModpackArchiveSafety.ExtractZipSafely(",
              "#if NEGATIVE_LAUNCHER_MULTIPLATFORM",
          )
          missing_installer_delegation = [
              token for token in required_installer_delegation
              if token not in installer_source
          ]
          if missing_installer_delegation:
              print("El instalador Linux debe delegar validación y extracción en el núcleo seguro.")
              print("\\n".join(f"  - {token}" for token in missing_installer_delegation))
              sys.exit(1)
          print("Correcto: el instalador Linux utiliza el extractor ZIP seguro del núcleo.")

          required_instance_path_guard = (
              "public static void ValidateDestinationPath(",
              "ModpackArchiveSafety.ValidateDestinationPath(",
              "ValidateInstanceDestination(instanceDirectory, destinationPath);",
          )
          missing_instance_path_guard = [
              token for token in required_instance_path_guard
              if token not in archive_safety_source + installer_source
          ]
          if missing_instance_path_guard:
              print("Falta validar los destinos de archivos de las instancias existentes.")
              print("\\n".join(f"  - {token}" for token in missing_instance_path_guard))
              sys.exit(1)
          print("Correcto: las actualizaciones validan las rutas de destino de la instancia.")

          # Las consultas de versiones de loaders también deben respetar cancelaciones antes y después de llamadas de red.
          runtime_source = Path(
              "NegativeLauncher.Core/Services/MinecraftRuntimeService.cs"
          ).read_text(encoding="utf-8")
          required_loader_cancellation = (
              'cancellationToken.ThrowIfCancellationRequested();\n                var versionLoader = new ForgeVersionLoader(_httpClient);',
              'var forgeVersions = await versionLoader.GetForgeVersions(instance.MinecraftVersion);\n                cancellationToken.ThrowIfCancellationRequested();',
              'var availableLoaders = await installer.GetLoaders(instance.MinecraftVersion);\n            cancellationToken.ThrowIfCancellationRequested();',
          )
          missing_loader_cancellation = [
              token for token in required_loader_cancellation
              if token not in runtime_source
          ]
          if missing_loader_cancellation:
              print("Las consultas de versiones de Forge/Fabric/Quilt deben respetar la cancelación.")
              print("\\n".join(f"  - {token}" for token in missing_loader_cancellation))
              sys.exit(1)
          print("Correcto: las consultas de versiones de loaders comprueban la cancelación.")

          # Los autoguardados y el cierre pueden intentar persistir preferencias a la vez.
          preferences_source = Path(
              "Negative Client/Negative Client/Services/LauncherPreferencesService.cs"
          ).read_text(encoding="utf-8")
          preferences_save_start = preferences_source.find("public async Task SaveAsync(")
          preferences_save_source = preferences_source[preferences_save_start:] if preferences_save_start >= 0 else ""
          required_preferences_save_contract = (
              "await SaveGate.WaitAsync();",
              "Guid.NewGuid().ToString(\"N\") + \".tmp\"",
              "File.Move(",
              "overwrite: true",
              "SaveGate.Release();",
              "File.Delete(temporaryPath)",
          )
          missing_preferences_save_contract = [
              token for token in required_preferences_save_contract
              if token not in preferences_save_source
          ]
          if missing_preferences_save_contract:
              print("El guardado de preferencias debe serializar escrituras, reemplazar el archivo y limpiar temporales.")
              print("\\n".join(f"  - {token}" for token in missing_preferences_save_contract))
              sys.exit(1)
          print("Correcto: guardado concurrente seguro de preferencias validado.")
          required_preferences_recovery_contract = (
              "LauncherDiagnostics.WriteException(",
              ".corrupt-",
              "File.Move(PreferencesFilePath, backupPath)",
              "await SaveAsync(defaults)",
          )
          if any(token not in preferences_source for token in required_preferences_recovery_contract):
              print("Las preferencias dañadas deben conservarse antes de restaurar los valores predeterminados.")
              sys.exit(1)
          print("Correcto: recuperación de preferencias dañadas con copia de respaldo validada.")
          # Las migraciones entre volúmenes deben publicar la copia completa antes de borrar el origen.
          instance_service_source = Path(
              "Negative Client/Negative Client/Services/InstanceService.cs"
          ).read_text(encoding="utf-8")
          cross_volume_start = instance_service_source.find("string stagingDirectory =")
          cross_volume_end = instance_service_source.find("private static void CopyDirectory(", cross_volume_start)
          cross_volume_source = instance_service_source[cross_volume_start:cross_volume_end] if cross_volume_start >= 0 and cross_volume_end > cross_volume_start else ""
          required_migration_contract = (
              "Guid.NewGuid().ToString(\"N\")",
              "CopyDirectory(",
              "Directory.Move(",
              "Directory.Delete(\n                            sourceDirectory",
              "Directory.Delete(\n                                    stagingDirectory",
          )
          missing_migration_contract = [token for token in required_migration_contract if token not in cross_volume_source]
          if missing_migration_contract:
              print("La migración entre volúmenes debe usar una carpeta provisional y conservar el origen hasta publicar la copia.")
              print("\\n".join(f"  - {token}" for token in missing_migration_contract))
              sys.exit(1)
          print("Correcto: migración entre volúmenes con staging y limpieza segura validada.")
          source_cleanup_start = cross_volume_source.find("// La copia ya está completa y publicada.")
          source_cleanup_end = cross_volume_source.find("                    }\n                    catch", source_cleanup_start)
          source_cleanup_source = cross_volume_source[source_cleanup_start:source_cleanup_end] if source_cleanup_start >= 0 and source_cleanup_end > source_cleanup_start else ""
          if "try" not in source_cleanup_source or "Directory.Delete(" not in source_cleanup_source or "catch" not in source_cleanup_source:
              print("La limpieza del origen no debe invalidar una copia entre volúmenes que ya fue publicada.")
              sys.exit(1)
          print("Correcto: un fallo al limpiar el origen conserva la copia publicada.")
          if "private static string GetVolumeRoot(" not in instance_service_source or "DriveInfo.GetDrives()" not in instance_service_source:
              print("La comparación de volúmenes debe contemplar puntos de montaje distintos en Linux.")
              sys.exit(1)
          print("Correcto: detección de volúmenes montados en Linux validada.")
          if (
              "var movedDirectories =" not in instance_service_source
              or "catch (Exception migrationException)" not in instance_service_source
              or "rollbackErrors" not in instance_service_source
              or "IsSameOrSubPath(\n                    newRoot,\n                    oldRoot)" not in instance_service_source
              or "IsSameOrSubPath(\n                    oldRoot,\n                    newRoot)" not in instance_service_source
          ):
              print("La migración debe revertir movimientos esenciales fallidos y rechazar raíces anidadas.")
              sys.exit(1)
          print("Correcto: reversión de migración y protección contra raíces anidadas validadas.")
          storage_normalize_start = instance_service_source.find("private static string NormalizeStorageRoot(")
          storage_normalize_end = instance_service_source.find("private static void EnsureStorageDirectories(", storage_normalize_start)
          storage_normalize_source = instance_service_source[storage_normalize_start:storage_normalize_end] if storage_normalize_start >= 0 and storage_normalize_end > storage_normalize_start else ""
          if "Path.TrimEndingDirectorySeparator(" not in storage_normalize_source or ".TrimEnd(" in storage_normalize_source:
              print("La normalización de almacenamiento debe preservar las raíces del sistema en Linux y Windows.")
              sys.exit(1)
          print("Correcto: las raíces de almacenamiento no se convierten en rutas vacías o relativas.")
          migration_test_source = Path("NegativeLauncher.Core.Tests/Program.cs").read_text(encoding="utf-8")
          required_migration_test_tokens = (
              "nestedStorageRejected",
              "partialMigrationRejected",
              "rootBeforeFailedMigration",
              "Si falla el segundo movimiento",
              "retirar la copia trasladada",
          )
          if any(token not in migration_test_source for token in required_migration_test_tokens):
              print("Las pruebas compartidas deben cubrir raíces anidadas y reversión cuando falla el segundo movimiento.")
              sys.exit(1)
          print("Correcto: regresiones de migración cubiertas por pruebas compartidas.")
          if (
              "string json = await File.ReadAllTextAsync(PreferencesFilePath);" not in preferences_source
              or "catch (Exception ex) when (ex is JsonException or NotSupportedException)" not in preferences_source
          ):
              print("Un fallo de lectura del disco no debe clasificarse automáticamente como JSON dañado.")
              sys.exit(1)
          print("Correcto: los errores de lectura no provocan mover ni reemplazar el archivo original.")

          play_handler_start = avalonia_window_source.find("private async void PlaySelectedInstance_Click(")
          play_handler_end = avalonia_window_source.find("private async Task StopRunningMinecraftAsync(", play_handler_start)
          play_handler = avalonia_window_source[play_handler_start:play_handler_end] if play_handler_start >= 0 and play_handler_end > play_handler_start else ""
          required_running_instance_contract = (
              "_runningGameInstanceId",
              "_runningGameProcess.HasExited",
              "_selectedInstance.Id",
              "StringComparison.OrdinalIgnoreCase",
              '"Minecraft ya está abierto"',
              "await ShowInformationAsync(",
          )
          if any(token not in play_handler for token in required_running_instance_contract):
              print("Jugar debe impedir iniciar otra instancia mientras Minecraft ya está abierto y permitir cerrar la instancia seleccionada.")
              sys.exit(1)
          print("Correcto: el botón Jugar respeta la instancia que ya está abierta.")

          # Evita que el port se desvíe de las dimensiones y colores base de la
          # ventana WPF que sirven como referencia visual para Linux.
          import xml.etree.ElementTree as ET

          reference_window = ET.parse(
              Path("Negative Client/Negative Client/MainWindow.xaml")
          ).getroot()
          port_window = ET.parse(project / "MainWindow.axaml").getroot()
          visual_contract = (
              "Title", "Width", "Height", "MinWidth", "MinHeight",
              "Background", "WindowStartupLocation"
          )
          visual_differences = []
          for property_name in visual_contract:
              reference_value = reference_window.attrib.get(property_name)
              port_value = port_window.attrib.get(property_name)
              if reference_value != port_value:
                  visual_differences.append(
                      f"{property_name}: WPF={reference_value!r}, Linux={port_value!r}"
                  )
          if visual_differences:
              print("La ventana Linux se desvió del contrato visual base de Windows:")
              print("\n".join(f"  - {difference}" for difference in visual_differences))
              sys.exit(1)
          print("Correcto: dimensiones, título, fondo y posición inicial de la ventana coinciden con WPF.")

          # La ventana sin bordes y la tipografía son parte esencial de la identidad visual.
          if port_window.attrib.get("SystemDecorations") != "None":
              print("La ventana Linux debe conservar la decoración personalizada sin bordes del launcher.")
              sys.exit(1)
          font_family = port_window.attrib.get("FontFamily", "")
          if not font_family.startswith("gg sans") or "Inter" not in font_family:
              print(f"Familia tipográfica inesperada en Linux: {font_family!r}")
              sys.exit(1)
          print("Correcto: ventana sin bordes y tipografía prioritaria conservadas.")

          # Contrato visual mínimo de la estructura compartida: estos tokens se
          # comparan con la referencia WPF para detectar desvíos accidentales
          # en la barra superior, la navegación y el acento de marca.
          reference_xaml_text = Path(
              "Negative Client/Negative Client/MainWindow.xaml"
          ).read_text(encoding="utf-8-sig")
          port_xaml_text = (project / "MainWindow.axaml").read_text(encoding="utf-8")
          required_visual_tokens = {
              "fondo principal": ('Background="#090B0E"', 'Background="#090B0E"'),
              "barra superior": ('Background="#292B2E"', 'Background="#292B2E"'),
              "barra lateral": ('Background="#0D1014"', 'Background="#0D1014"'),
              "borde exterior": ('BorderBrush="#34383D"', 'BorderBrush="#34383D"'),
              "acento celeste de marca": ('#6AD8E8', '#6AD8E8'),
              "superficie de navegación": ('#1C2229', '#1C2229'),
              "separador secundario": ('#343A41', '#343A41'),
              "texto de versión": ('#F0F0F0', '#F0F0F0'),
              "texto de instancia seleccionada": ('#B8BEC6', '#B8BEC6'),
              "acento de advertencia": ('#E6B84C', '#E6B84C'),
              "botón de instalación celeste": ('#58D0E3', '#58D0E3'),
              "progreso de descarga": ('#55D66B', '#55D66B'),
              "texto claro de estado": ('#DDDDDD', '#DDDDDD'),
              "altura de barra superior": ('<RowDefinition Height="48"/>', 'RowDefinitions="48,*"'),
              "ancho de navegación lateral": ('<ColumnDefinition Width="86"/>', 'ColumnDefinitions="86,*"'),
          }
          visual_token_differences = []
          for label, (reference_token, port_token) in required_visual_tokens.items():
              if reference_token not in reference_xaml_text:
                  visual_token_differences.append(f"WPF no contiene el token de referencia para {label}.")
              if port_token not in port_xaml_text:
                  visual_token_differences.append(f"Avalonia no conserva el token de {label}.")
          if visual_token_differences:
              print("La estructura visual Linux se desvió de tokens de referencia:")
              print("\\n".join(f"  - {difference}" for difference in visual_token_differences))
              sys.exit(1)
          print(f"Correcto: {len(required_visual_tokens)} tokens visuales clave conservados frente a WPF.")

          # Comparar propiedades concretas de controles equivalentes, no solo la
          # presencia de colores en el documento. Se excluyen propiedades que
          # cambian de nombre entre WPF y Avalonia, como Visibility/IsVisible.
          xaml_name_attribute = "{http://schemas.microsoft.com/winfx/2006/xaml}Name"

          def index_named_controls(root):
              indexed = {}
              for element in root.iter():
                  name = element.attrib.get(xaml_name_attribute) or element.attrib.get("Name")
                  if name:
                      indexed[name] = element
              return indexed

          reference_named_controls = index_named_controls(reference_window)
          port_named_controls = index_named_controls(port_window)
          control_property_contract = (
              ("MainCenterPanel", "MainCenterPanel", ("HorizontalAlignment", "VerticalAlignment", "Margin")),
              ("MainTitleText", "MainTitleText", ("Text", "Foreground", "FontSize", "FontWeight", "HorizontalAlignment")),
              ("SelectedModpackText", "HomeSelectedInstanceText", ("Text", "Foreground", "FontSize", "Margin", "HorizontalAlignment")),
              ("DeveloperVersionPanel", "DeveloperVersionPanel", ("Width", "Margin", "Padding", "Background", "BorderBrush", "BorderThickness", "CornerRadius")),
              ("TopLeftLogoImage", "BrandLogo", ("Width", "Height", "Stretch", "HorizontalAlignment", "VerticalAlignment", "Margin")),
              ("GalleryRefreshButton", "GalleryRefreshButton", ("Content", "Width", "Height", "Background", "Foreground", "BorderThickness")),
              ("GallerySelectionModeButton", "GallerySelectionButton", ("Content", "Width", "Height", "Background", "Foreground", "BorderThickness")),
              ("GalleryDeleteSelectedButton", "GalleryDeleteSelectedButton", ("Height", "Padding", "Background", "Foreground", "BorderThickness")),
              ("MicrosoftWarningBorder", "HomeAccountWarningBorder", ("HorizontalAlignment", "VerticalAlignment", "Margin", "Padding", "Background", "CornerRadius", "Cursor")),
              ("AccountQuickRoot", "AccountQuickRoot", ("Width", "HorizontalAlignment", "VerticalAlignment", "Margin")),
              ("AccountQuickButton", "QuickAccountButton", ("Width", "Height", "HorizontalAlignment", "Background", "BorderBrush", "BorderThickness", "Padding")),
              ("QuickCurrentAccountNameText", "QuickCurrentAccountNameText", ("Width", "Text", "TextTrimming", "Foreground", "FontSize", "FontWeight", "VerticalAlignment", "Margin")),
              ("GalleryViewerTitleText", "GalleryViewerTitle", ("Foreground", "FontSize", "FontWeight", "VerticalAlignment")),
              ("GalleryViewerInfoText", "GalleryViewerDetails", ("Foreground", "FontSize", "TextAlignment")),
              ("PlayButton", "HomePlayButton", ("Content", "IsEnabled")),
              ("StatusText", "GameStatus", ("Text", "Foreground", "FontSize", "HorizontalAlignment", "Margin")),
              ("InstanceOptionsButton", "HomeInstanceOptionsButton", ("Width", "Height", "HorizontalAlignment", "VerticalAlignment", "Margin", "Content", "FontSize", "Background", "Foreground", "BorderBrush", "BorderThickness")),
              ("GalleryInstanceFilterComboBox", "GalleryInstanceFilter", ("Height",)),
              ("GallerySortComboBox", "GallerySortFilter", ("Height", "SelectedIndex")),
              ("GalleryStatusText", "GalleryCountText", ("Foreground", "FontSize", "VerticalAlignment", "HorizontalAlignment", "Margin")),
              ("LoginGate", "LoginGate", ("Background",)),
              ("LoginOptionsPanel", "LoginOptionsPanel", ("Background", "BorderBrush", "BorderThickness", "CornerRadius", "Padding")),
              ("ChooseOfflineLoginButton", "ChooseOfflineLoginButton", ("Height", "Background", "Content")),
              ("OfflineLoginPanel", "OfflineLoginPanel", ("Background", "BorderBrush", "BorderThickness", "CornerRadius", "Padding")),
              ("OfflineUsernameBox", "OfflineUsernameBox", ("Height", "Padding", "MaxLength")),
              ("LoginMicrosoftButton", "LoginMicrosoftButton", ("Height", "Background")),
              ("LoginOfflineButton", "LoginOfflineButton", ("Height", "Background", "Margin", "Content")),
              ("BackToLoginOptionsButton", "BackToLoginOptionsButton", ("Height", "Background", "Margin", "Content")),
              ("LoginStatusText", "LoginStatusText", ("Foreground", "FontSize", "TextWrapping", "Margin")),
              ("DownloadProgressPanel", "DownloadProgressPanel", ("Width", "Margin")),
              ("DownloadProgressText", "RuntimeGlobalOperationMessage", ("Text", "Foreground", "FontSize", "Margin")),
              ("DownloadProgressTrack", "DownloadProgressTrack", ("Height", "Background", "CornerRadius", "ClipToBounds")),
              ("OperationActionPanel", "RuntimeGlobalOperationPanel", ("Width", "Height")),
              ("OperationStopButton", "RuntimeGlobalOperationStopButton", ("Content", "Background")),
              ("OperationPauseResumeButton", "RuntimeGlobalOperationPauseResumeButton", ("Content", "Background")),
          )
          control_property_differences = []
          for reference_name, port_name, properties in control_property_contract:
              reference_control = reference_named_controls.get(reference_name)
              port_control = port_named_controls.get(port_name)
              if reference_control is None or port_control is None:
                  control_property_differences.append(
                      f"Falta control visual: WPF={reference_name}, Linux={port_name}"
                  )
                  continue
              for property_name in properties:
                  reference_value = reference_control.attrib.get(property_name)
                  port_value = port_control.attrib.get(property_name)
                  if reference_value != port_value:
                      control_property_differences.append(
                          f"{reference_name}.{property_name}: WPF={reference_value!r}, Linux={port_value!r}"
                      )
          if control_property_differences:
              print("Se detectaron diferencias en propiedades visuales equivalentes:")
              print("\\n".join(f"  - {difference}" for difference in control_property_differences))
              sys.exit(1)

          # En el control de progreso, WPF pinta el relleno con Background,
          # mientras que Avalonia usa Foreground en ProgressBar.
          cross_property_contract = (
              ("DownloadProgressFill", "RuntimeGlobalOperationProgress", "Background", "Foreground"),
          )
          cross_property_differences = []
          for reference_name, port_name, reference_property, port_property in cross_property_contract:
              reference_control = reference_named_controls.get(reference_name)
              port_control = port_named_controls.get(port_name)
              if reference_control is None or port_control is None:
                  cross_property_differences.append(
                      f"Falta control para comparación de propiedad equivalente: {reference_name} -> {port_name}"
                  )
                  continue
              reference_value = reference_control.attrib.get(reference_property)
              port_value = port_control.attrib.get(port_property)
              if reference_value != port_value:
                  cross_property_differences.append(
                      f"{reference_name}.{reference_property}={reference_value!r}, "
                      f"{port_name}.{port_property}={port_value!r}"
                  )
          if cross_property_differences:
              print("Se detectaron diferencias en propiedades visuales equivalentes con distinto nombre:")
              print("\\n".join(f"  - {difference}" for difference in cross_property_differences))
              sys.exit(1)
          property_count = sum(len(properties) for _, _, properties in control_property_contract)
          property_count += len(cross_property_contract)
          print(f"Correcto: {property_count} propiedades visuales concretas comparadas en {len(control_property_contract)} controles.")

          # Los márgenes explícitos de WPF ya separan estos grupos. Avalonia no
          # debe sumarles Spacing global porque duplicaría el espacio vertical.
          login_spacing_contract = (
              ("42,40,34,48", "panel izquierdo de marca"),
              ("30,26,30,22", "contenido derecho de inicio de sesión"),
          )
          login_spacing_differences = []
          for margin_value, description in login_spacing_contract:
              reference_matches = [
                  element for element in reference_named_controls["LoginGate"].iter()
                  if element.attrib.get("Margin") == margin_value and element.tag.endswith("StackPanel")
              ]
              port_matches = [
                  element for element in port_named_controls["LoginGate"].iter()
                  if element.attrib.get("Margin") == margin_value and element.tag.endswith("StackPanel")
              ]
              if not reference_matches or not port_matches:
                  login_spacing_differences.append(f"No se encontró el contenedor {description} en ambas interfaces")
                  continue
              if any("Spacing" in element.attrib for element in port_matches):
                  login_spacing_differences.append(f"{description}: Avalonia aplica Spacing además de los márgenes explícitos")
          if login_spacing_differences:
              print("Diferencias de espaciado en la pantalla de inicio de sesión:")
              print("\\n".join(f"  - {difference}" for difference in login_spacing_differences))
              sys.exit(1)
          print("Correcto: el espaciado de los dos contenedores principales de inicio coincide con los márgenes WPF.")

          # Protege las pantallas y controles principales para que una futura
          # modificación no convierta el port en una ventana que solo compila.
          port_control_names = set(re.findall(r'x:Name="([^"]+)"', port_xaml_text))

          # Un selector de estilo repetido puede sobrescribir silenciosamente las
          # dimensiones de un control, como ocurrió con los botones de ventana.
          style_selectors = re.findall(r'<Style Selector="([^"]+)"', port_xaml_text)
          duplicate_style_selectors = sorted({
              selector for selector in style_selectors
              if style_selectors.count(selector) > 1
          })
          if duplicate_style_selectors:
              print("Hay selectores de estilo duplicados en Avalonia:")
              print("\\n".join(f"  - {selector}" for selector in duplicate_style_selectors))
              sys.exit(1)
          print(f"Correcto: {len(style_selectors)} selectores de estilo sin duplicados.")

          required_port_controls = {
              "LoginGate",
              "HomePage",
              "HomePlayButton",
              "InstancesPage",
              "ModpacksPage",
              "InstallModpackButton",
              "GalleryPage",
              "GalleryImagesPanel",
              "SettingsPage",
              "AccountsList",
              "RamSlider",
              "JavaPathInput",
          }
          missing_port_controls = sorted(required_port_controls - port_control_names)
          if missing_port_controls:
              print("Faltan controles esenciales del port Linux:")
              print("\\n".join(f"  - {name}" for name in missing_port_controls))
              sys.exit(1)
          print(f"Correcto: las {len(required_port_controls)} pantallas y acciones principales del port están presentes.")
          PY

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore "Prototipo Avalonia/NegativeLauncher.AvaloniaPrototype.csproj"

      - name: Ejecutar pruebas multiplataforma del núcleo
        run: >-
          dotnet run
          --project "NegativeLauncher.Core.Tests/NegativeLauncher.Core.Tests.csproj"
          --configuration Release

      - name: Publicar para la plataforma
        run: >-
          dotnet publish "Prototipo Avalonia/NegativeLauncher.AvaloniaPrototype.csproj"
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output "./publicacion/${{ matrix.rid }}"
          -p:UseAppHost=true
          -p:PublishTrimmed=false

      - name: Comprobar inicio gráfico en Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          EXECUTABLE="./publicacion/${{ matrix.rid }}/NegativeLauncher.AvaloniaPrototype"
          LOG="$RUNNER_TEMP/negative-launcher-linux-smoke.log"
          TEST_DATA_HOME="$RUNNER_TEMP/negative-launcher-test-data"
          APP_LOG="$TEST_DATA_HOME/NegativeClient/logs/negative-launcher.log"
          command -v xvfb-run
          mkdir -p "$TEST_DATA_HOME"
          {
            echo "Runtime: ${{ matrix.rid }}"
            echo "Kernel: $(uname -a)"
            echo "Ejecutable:"
            file "$EXECUTABLE" || true
            echo "Dependencias nativas:"
            ldd "$EXECUTABLE" 2>&1 || true
            echo "Salida de inicio:"
          } > "$LOG"
          if grep -Fq "not found" "$LOG"; then
            cat "$LOG"
            echo "El ejecutable Linux tiene dependencias nativas sin resolver." >&2
            exit 1
          fi
          set +e
          NEGATIVE_LAUNCHER_UI_SMOKE=1 XDG_DATA_HOME="$TEST_DATA_HOME" timeout 30s xvfb-run -a "$EXECUTABLE" >> "$LOG" 2>&1
          RESULT=$?
          set -e
          if [ "$RESULT" -ne 124 ]; then
            cat "$LOG"
            echo "El launcher no permaneció abierto durante la prueba gráfica (código: $RESULT)." >&2
            exit 1
          fi
          if [ ! -s "$APP_LOG" ] || ! grep -Fq "Inicialización de datos completada; la ventana principal está lista." "$APP_LOG"; then
            cat "$LOG"
            if [ -f "$APP_LOG" ]; then cat "$APP_LOG"; fi
            echo "La ventana permaneció abierta, pero no terminó su inicialización de datos." >&2
            exit 1
          fi
          if ! grep -Fq "NEGATIVE_LAUNCHER_UI_SMOKE_OK" "$LOG"; then
            cat "$LOG"
            cat "$APP_LOG"
            echo "El launcher arrancó, pero no completó el recorrido automatizado de las pantallas." >&2
            exit 1
          fi
          echo "Recorrido automatizado de interfaz completado correctamente."

      - name: Guardar diagnóstico del arranque Linux
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-arranque-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/negative-launcher-linux-smoke.log
            ${{ runner.temp }}/negative-launcher-test-data/NegativeClient/logs/negative-launcher.log
          if-no-files-found: warn
          retention-days: 14

      - name: Empaquetar Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          DIR="./publicacion/${{ matrix.rid }}"
          EXECUTABLE="$DIR/NegativeLauncher.AvaloniaPrototype"
          test -f "$EXECUTABLE"
          FILE_DESCRIPTION="$(file -b "$EXECUTABLE")"
          echo "$FILE_DESCRIPTION"
          case "${{ matrix.rid }}" in
            linux-x64)
              echo "$FILE_DESCRIPTION" | grep -Eqi 'x86-64|x86_64'
              ;;
            linux-arm64)
              echo "$FILE_DESCRIPTION" | grep -Eqi 'aarch64|ARM aarch64'
              ;;
            *)
              echo "Runtime Linux no contemplado: ${{ matrix.rid }}" >&2
              exit 1
              ;;
          esac
          chmod +x "$EXECUTABLE"
          cat > "$DIR/iniciar-negative-launcher.sh" <<'LAUNCHER'
          #!/usr/bin/env sh
          set -eu
          SCRIPT_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          EXECUTABLE="$SCRIPT_DIR/NegativeLauncher.AvaloniaPrototype"
          if [ ! -x "$EXECUTABLE" ]; then
            echo "No se encontró el ejecutable del launcher o no tiene permiso de ejecución:" >&2
            echo "$EXECUTABLE" >&2
            exit 1
          fi
          exec "$EXECUTABLE" "$@"
          LAUNCHER
          chmod +x "$DIR/iniciar-negative-launcher.sh"
          cat > "$DIR/instalar-acceso-escritorio.sh" <<'DESKTOP_INSTALLER'
          #!/usr/bin/env sh
          set -eu
          SCRIPT_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          LAUNCHER="$SCRIPT_DIR/iniciar-negative-launcher.sh"
          if [ ! -x "$LAUNCHER" ]; then
            echo "Ejecuta este instalador desde la carpeta completa de Negative Launcher." >&2
            exit 1
          fi
          ESCAPED_LAUNCHER="$(printf '%s' "$LAUNCHER" | sed 's/\\/\\\\/g; s/"/\\"/g; s/%/%%/g')"
          DATA_HOME="${XDG_DATA_HOME:-}"
          case "$DATA_HOME" in
            /*) ;;
            *) DATA_HOME="$HOME/.local/share" ;;
          esac
          APPLICATIONS_DIR="$DATA_HOME/applications"
          mkdir -p "$APPLICATIONS_DIR"
          DESKTOP_FILE="$APPLICATIONS_DIR/negative-launcher.desktop"
          ICON_ENTRY=""
          ICON_SOURCE="$SCRIPT_DIR/Assets/negativeclient_logo.png"
          if [ -f "$ICON_SOURCE" ]; then
            ICON_DIR="$DATA_HOME/icons/hicolor/256x256/apps"
            mkdir -p "$ICON_DIR"
            cp "$ICON_SOURCE" "$ICON_DIR/negative-launcher.png"
            ICON_ENTRY="Icon=negative-launcher"
          fi
          cat > "$DESKTOP_FILE" <<ENTRY
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Negative Launcher
          Comment=Launcher de Minecraft de NegativeStudios
          Exec="$ESCAPED_LAUNCHER"
          $ICON_ENTRY
          Terminal=false
          Categories=Game;
          ENTRY
          chmod 644 "$DESKTOP_FILE"
          printf 'Acceso creado: %s\n' "$DESKTOP_FILE"
          DESKTOP_INSTALLER
          chmod +x "$DIR/instalar-acceso-escritorio.sh"
          cat > "$DIR/LEEME.txt" <<'README'
          Negative Launcher 0.1.1 — Linux

          INICIO
          1. Extrae el paquete completo en una carpeta permanente.
          2. Ejecuta iniciar-negative-launcher.sh desde el gestor de archivos
             o desde una terminal.
          3. No muevas el ejecutable fuera de esta carpeta: necesita los archivos
             de runtime y recursos que lo acompañan.
          4. Opcional: ejecuta instalar-acceso-escritorio.sh para crear un acceso
             en el menú de aplicaciones de tu escritorio Linux.

          Si no abre, ejecútalo desde una terminal para ver el mensaje de error.
          En distribuciones mínimas puede ser necesario instalar las bibliotecas
          gráficas del sistema requeridas por Avalonia.

          Este paquete es una compilación de desarrollo. La publicación correcta
          confirma que el artefacto se generó, no que todas las funciones hayan
          sido validadas en equipos Linux reales.
          README
          sh -n "$DIR/iniciar-negative-launcher.sh"
          sh -n "$DIR/instalar-acceso-escritorio.sh"
          TEST_HOME="$RUNNER_TEMP/negative-launcher-home"
          TEST_DIR="$RUNNER_TEMP/Negative Launcher 50% ñ \"comillas\" prueba"
          mkdir -p "$TEST_HOME" "$TEST_DIR/Assets"
          cp "$DIR/instalar-acceso-escritorio.sh" "$TEST_DIR/"
          cp "$DIR/iniciar-negative-launcher.sh" "$TEST_DIR/"
          test -s "$DIR/Assets/negativeclient_logo.png"
          cp "$DIR/Assets/negativeclient_logo.png" "$TEST_DIR/Assets/"
          cat > "$TEST_DIR/NegativeLauncher.AvaloniaPrototype" <<'LAUNCHER_STUB'
          #!/usr/bin/env sh
          printf '%s\n' "$@" > "$NEGATIVE_LAUNCHER_TEST_ARGS"
          LAUNCHER_STUB
          chmod +x "$TEST_DIR/NegativeLauncher.AvaloniaPrototype"
          NEGATIVE_LAUNCHER_TEST_ARGS="$TEST_HOME/argumentos.txt" "$TEST_DIR/iniciar-negative-launcher.sh" "argumento con espacios" "segundo"
          grep -Fx "argumento con espacios" "$TEST_HOME/argumentos.txt"
          grep -Fx "segundo" "$TEST_HOME/argumentos.txt"
          HOME="$TEST_HOME" XDG_DATA_HOME="$TEST_HOME/.local/share" "$TEST_DIR/instalar-acceso-escritorio.sh"
          ESCAPED_TEST_LAUNCHER="$(printf '%s' "$TEST_DIR/iniciar-negative-launcher.sh" | sed 's/\\/\\\\/g; s/"/\\"/g; s/%/%%/g')"
          grep -Fx "Exec=\"$ESCAPED_TEST_LAUNCHER\"" "$TEST_HOME/.local/share/applications/negative-launcher.desktop"
          grep -Fx "Name=Negative Launcher" "$TEST_HOME/.local/share/applications/negative-launcher.desktop"
          grep -Fx "Terminal=false" "$TEST_HOME/.local/share/applications/negative-launcher.desktop"
          grep -Fx "Categories=Game;" "$TEST_HOME/.local/share/applications/negative-launcher.desktop"
          grep -Fx "Icon=negative-launcher" "$TEST_HOME/.local/share/applications/negative-launcher.desktop"
          test "$(stat -c '%a' "$TEST_HOME/.local/share/applications/negative-launcher.desktop")" = "644"
          test -s "$TEST_HOME/.local/share/icons/hicolor/256x256/apps/negative-launcher.png"
          FALLBACK_HOME="$RUNNER_TEMP/negative-launcher-xdg-fallback-home"
          mkdir -p "$FALLBACK_HOME"
          (
            cd "$RUNNER_TEMP"
            HOME="$FALLBACK_HOME" XDG_DATA_HOME="ruta/relativa" "$TEST_DIR/instalar-acceso-escritorio.sh"
          )
          test -s "$FALLBACK_HOME/.local/share/applications/negative-launcher.desktop"
          test ! -e "$RUNNER_TEMP/ruta/relativa/applications/negative-launcher.desktop"
          ARCHIVE="./publicacion/NegativeLauncher-${{ matrix.rid }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$DIR" .
          tar -tzf "$ARCHIVE" > "$RUNNER_TEMP/negative-launcher-linux-archive-list.txt"
          grep -Fq "iniciar-negative-launcher.sh" "$RUNNER_TEMP/negative-launcher-linux-archive-list.txt"
          grep -Fq "instalar-acceso-escritorio.sh" "$RUNNER_TEMP/negative-launcher-linux-archive-list.txt"
          grep -Fq "NegativeLauncher.AvaloniaPrototype" "$RUNNER_TEMP/negative-launcher-linux-archive-list.txt"
          (
            cd ./publicacion
            sha256sum "NegativeLauncher-${{ matrix.rid }}.tar.gz" > "NegativeLauncher-${{ matrix.rid }}.tar.gz.sha256"
          )
          (cd ./publicacion && sha256sum --check "NegativeLauncher-${{ matrix.rid }}.tar.gz.sha256")

      - name: Probar el paquete Linux extraído
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ARCHIVE="./publicacion/NegativeLauncher-${{ matrix.rid }}.tar.gz"
          EXTRACT_ROOT="$RUNNER_TEMP/Negative Launcher 50% empaquetado ${{ matrix.rid }}"
          TEST_DATA_HOME="$RUNNER_TEMP/negative-launcher-packaged-test-data"
          APP_LOG="$TEST_DATA_HOME/NegativeClient/logs/negative-launcher.log"
          SMOKE_LOG="$RUNNER_TEMP/negative-launcher-packaged-smoke.log"
          mkdir -p "$EXTRACT_ROOT" "$TEST_DATA_HOME"
          (cd ./publicacion && sha256sum --check "NegativeLauncher-${{ matrix.rid }}.tar.gz.sha256")
          tar -xzf "$ARCHIVE" -C "$EXTRACT_ROOT"
          EXECUTABLE="$EXTRACT_ROOT/NegativeLauncher.AvaloniaPrototype"
          LAUNCHER="$EXTRACT_ROOT/iniciar-negative-launcher.sh"
          INSTALL_HOME="$RUNNER_TEMP/negative-launcher-installed-home"
          DESKTOP_FILE="$INSTALL_HOME/.local/share/applications/negative-launcher.desktop"
          ICON_FILE="$INSTALL_HOME/.local/share/icons/hicolor/256x256/apps/negative-launcher.png"
          test -x "$EXECUTABLE"
          test -x "$LAUNCHER"
          test -x "$EXTRACT_ROOT/instalar-acceso-escritorio.sh"
          sh -n "$LAUNCHER"
          sh -n "$EXTRACT_ROOT/instalar-acceso-escritorio.sh"
          mkdir -p "$INSTALL_HOME"
          HOME="$INSTALL_HOME" XDG_DATA_HOME="$INSTALL_HOME/.local/share" "$EXTRACT_ROOT/instalar-acceso-escritorio.sh"
          test -s "$DESKTOP_FILE"
          ESCAPED_LAUNCHER_PATH="$(printf '%s' "$LAUNCHER" | sed 's/%/%%/g')"
          grep -F "Exec=\"$ESCAPED_LAUNCHER_PATH\"" "$DESKTOP_FILE"
          grep -Fx "Icon=negative-launcher" "$DESKTOP_FILE"
          test -s "$ICON_FILE"
          set +e
          NEGATIVE_LAUNCHER_UI_SMOKE=1 XDG_DATA_HOME="$TEST_DATA_HOME" timeout 30s xvfb-run -a "$LAUNCHER" > "$SMOKE_LOG" 2>&1
          RESULT=$?
          set -e
          if [ "$RESULT" -ne 124 ]; then
            cat "$SMOKE_LOG"
            echo "El launcher empaquetado no permaneció abierto durante la prueba (código: $RESULT)." >&2
            exit 1
          fi
          if [ ! -s "$APP_LOG" ] || ! grep -Fq "Inicialización de datos completada; la ventana principal está lista." "$APP_LOG"; then
            cat "$SMOKE_LOG"
            if [ -f "$APP_LOG" ]; then cat "$APP_LOG"; fi
            echo "El paquete extraído no completó la inicialización gráfica." >&2
            exit 1
          fi
          if ! grep -Fq "NEGATIVE_LAUNCHER_UI_SMOKE_OK" "$SMOKE_LOG"; then
            cat "$SMOKE_LOG"
            cat "$APP_LOG"
            echo "El paquete extraído arrancó, pero no completó el recorrido automatizado de las pantallas." >&2
            exit 1
          fi
          echo "El paquete Linux extraído completó el recorrido automatizado de interfaz."
          cat "$SMOKE_LOG"

      - name: Guardar artefacto de la plataforma
        uses: actions/upload-artifact@v4
        with:
          name: NegativeLauncher-${{ matrix.rid }}
          path: ./publicacion/NegativeLauncher-${{ matrix.rid }}.*
          if-no-files-found: error
          retention-days: 14

  validar-flujo-de-publicacion:
    name: Validar sintaxis del flujo de release
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Go para actionlint
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Instalar actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Validar todos los workflows del repositorio
        shell: bash
        run: |
          mapfile -d '' workflows < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)
          if [ "${#workflows[@]}" -eq 0 ]; then
            echo "No se encontraron workflows para validar." >&2
            exit 1
          fi
          "$HOME/go/bin/actionlint" "${workflows[@]}"

  probar-logica-compartida:
    name: Probar lógica compartida (${{ matrix.sistema }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: Linux x64
            runner: ubuntu-latest
          - sistema: Linux ARM64
            runner: ubuntu-24.04-arm
          - sistema: Windows x64
            runner: windows-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Ejecutar pruebas de lógica compartida
        run: dotnet run --project "NegativeLauncher.Core.Tests/NegativeLauncher.Core.Tests.csproj" --configuration Release
