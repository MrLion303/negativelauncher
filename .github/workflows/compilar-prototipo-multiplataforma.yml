name: Compilar base multiplataforma de Negative Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - portabilidad-multiplataforma
      - portabilidad-fiel-0.1.1
    paths:
      - 'Prototipo Avalonia/**'
      - 'NegativeLauncher.Core/**'
      - 'NegativeLauncher.Core.Tests/**'
      - 'Negative Client/Negative Client/Services/ModpackInstallerService.cs'
      - '.github/workflows/compilar-prototipo-multiplataforma.yml'
      - '.github/workflows/publicar-release-multiplataforma.yml'

permissions:
  contents: read

concurrency:
  group: portabilidad-multiplataforma-${{ github.ref }}
  # No cancelar una compilación en curso por cada commit pequeño del port.
  # Así se obtienen resultados completos de las cinco plataformas.
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar para ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: osx-x64
            runner: macos-15
          - rid: osx-arm64
            runner: macos-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore "Prototipo Avalonia/NegativeLauncher.AvaloniaPrototype.csproj"

      - name: Publicar para la plataforma
        run: >-
          dotnet publish "Prototipo Avalonia/NegativeLauncher.AvaloniaPrototype.csproj"
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output "./publicacion/${{ matrix.rid }}"
          -p:UseAppHost=true
          -p:PublishTrimmed=false

      - name: Comprobar inicio gráfico en Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          EXECUTABLE="./publicacion/${{ matrix.rid }}/NegativeLauncher.AvaloniaPrototype"
          LOG="$RUNNER_TEMP/negative-launcher-linux-smoke.log"
          TEST_DATA_HOME="$RUNNER_TEMP/negative-launcher-test-data"
          APP_LOG="$TEST_DATA_HOME/NegativeClient/logs/negative-launcher.log"
          command -v xvfb-run
          mkdir -p "$TEST_DATA_HOME"
          {
            echo "Runtime: ${{ matrix.rid }}"
            echo "Kernel: $(uname -a)"
            echo "Ejecutable:"
            file "$EXECUTABLE" || true
            echo "Dependencias nativas:"
            ldd "$EXECUTABLE" 2>&1 || true
            echo "Salida de inicio:"
          } > "$LOG"
          set +e
          XDG_DATA_HOME="$TEST_DATA_HOME" timeout 20s xvfb-run -a "$EXECUTABLE" >> "$LOG" 2>&1
          RESULT=$?
          set -e
          if [ "$RESULT" -ne 124 ]; then
            cat "$LOG"
            echo "El launcher no permaneció abierto durante la prueba gráfica (código: $RESULT)." >&2
            exit 1
          fi
          if [ ! -s "$APP_LOG" ] || ! grep -Fq "Inicialización de datos completada; la ventana principal está lista." "$APP_LOG"; then
            cat "$LOG"
            if [ -f "$APP_LOG" ]; then cat "$APP_LOG"; fi
            echo "La ventana permaneció abierta, pero no terminó su inicialización de datos." >&2
            exit 1
          fi

      - name: Comprobar inicio gráfico en macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          EXECUTABLE="./publicacion/${{ matrix.rid }}/NegativeLauncher.AvaloniaPrototype"
          LOG="$RUNNER_TEMP/negative-launcher-macos-smoke.log"
          TEST_HOME="$RUNNER_TEMP/negative-launcher-test-home"
          APP_LOG="$TEST_HOME/Library/Application Support/NegativeClient/logs/negative-launcher.log"
          mkdir -p "$TEST_HOME"
          {
            echo "Runtime: ${{ matrix.rid }}"
            echo "Kernel: $(uname -a)"
            echo "Ejecutable:"
            file "$EXECUTABLE" || true
            echo "Inicio de la aplicación:"
          } > "$LOG"
          python3 - "$EXECUTABLE" "$APP_LOG" "$LOG" <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import time

          executable = pathlib.Path(sys.argv[1]).resolve()
          app_log = pathlib.Path(sys.argv[2])
          output_log = pathlib.Path(sys.argv[3])
          home = output_log.parent / "negative-launcher-test-home"
          env = os.environ.copy()
          env["HOME"] = str(home)
          env["XDG_DATA_HOME"] = str(home / ".local" / "share")
          process = None

          with output_log.open("a", encoding="utf-8") as output:
              try:
                  process = subprocess.Popen(
                      [str(executable)],
                      cwd=str(executable.parent),
                      env=env,
                      stdout=output,
                      stderr=subprocess.STDOUT,
                  )
                  deadline = time.monotonic() + 45
                  ready_message = "Inicialización de datos completada; la ventana principal está lista."
                  while time.monotonic() < deadline:
                      if process.poll() is not None:
                          raise RuntimeError(
                              f"El launcher se cerró durante el arranque (código {process.returncode})."
                          )
                      if app_log.exists():
                          try:
                              contents = app_log.read_text(encoding="utf-8", errors="replace")
                          except OSError:
                              contents = ""
                          if ready_message in contents:
                              print("La ventana y la inicialización de datos están listas.", flush=True)
                              break
                      time.sleep(0.25)
                  else:
                      details = ""
                      if app_log.exists():
                          details = app_log.read_text(encoding="utf-8", errors="replace")[-8000:]
                      raise RuntimeError(
                          "El launcher no completó la inicialización en 45 segundos.\n" + details
                      )
              finally:
                  if process is not None and process.poll() is None:
                      process.terminate()
                      try:
                          process.wait(timeout=8)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.wait(timeout=5)
          PY

      - name: Guardar diagnóstico del arranque macOS
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-arranque-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/negative-launcher-macos-smoke.log
            ${{ runner.temp }}/negative-launcher-test-home/Library/Application Support/NegativeClient/logs/negative-launcher.log
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar diagnóstico del arranque Linux
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-arranque-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/negative-launcher-linux-smoke.log
            ${{ runner.temp }}/negative-launcher-test-data/NegativeClient/logs/negative-launcher.log
          if-no-files-found: warn
          retention-days: 14

      - name: Empaquetar Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "./publicacion/${{ matrix.rid }}/*" -DestinationPath "./publicacion/NegativeLauncher-${{ matrix.rid }}.zip"

      - name: Empaquetar Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          DIR="./publicacion/${{ matrix.rid }}"
          EXECUTABLE="$DIR/NegativeLauncher.AvaloniaPrototype"
          test -f "$EXECUTABLE"
          chmod +x "$EXECUTABLE"
          cat > "$DIR/iniciar-negative-launcher.sh" <<'LAUNCHER'
          #!/usr/bin/env sh
          set -eu
          SCRIPT_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          EXECUTABLE="$SCRIPT_DIR/NegativeLauncher.AvaloniaPrototype"
          if [ ! -x "$EXECUTABLE" ]; then
            echo "No se encontró el ejecutable del launcher o no tiene permiso de ejecución:" >&2
            echo "$EXECUTABLE" >&2
            exit 1
          fi
          exec "$EXECUTABLE" "$@"
          LAUNCHER
          chmod +x "$DIR/iniciar-negative-launcher.sh"
          cat > "$DIR/instalar-acceso-escritorio.sh" <<'DESKTOP_INSTALLER'
          #!/usr/bin/env sh
          set -eu
          SCRIPT_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          LAUNCHER="$SCRIPT_DIR/iniciar-negative-launcher.sh"
          if [ ! -x "$LAUNCHER" ]; then
            echo "Ejecuta este instalador desde la carpeta completa de Negative Launcher." >&2
            exit 1
          fi
          ESCAPED_LAUNCHER="$(printf '%s' "$LAUNCHER" | sed 's/\\/\\\\/g; s/"/\\"/g')"
          DATA_HOME="${XDG_DATA_HOME:-$HOME/.local/share}"
          APPLICATIONS_DIR="$DATA_HOME/applications"
          mkdir -p "$APPLICATIONS_DIR"
          DESKTOP_FILE="$APPLICATIONS_DIR/negative-launcher.desktop"
          ICON_ENTRY=""
          ICON_SOURCE="$SCRIPT_DIR/Assets/negativeclient_logo.png"
          if [ -f "$ICON_SOURCE" ]; then
            ICON_DIR="$DATA_HOME/icons/hicolor/256x256/apps"
            mkdir -p "$ICON_DIR"
            cp "$ICON_SOURCE" "$ICON_DIR/negative-launcher.png"
            ICON_ENTRY="Icon=negative-launcher"
          fi
          cat > "$DESKTOP_FILE" <<ENTRY
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Negative Launcher
          Comment=Launcher de Minecraft de NegativeStudios
          Exec="$ESCAPED_LAUNCHER"
          $ICON_ENTRY
          Terminal=false
          Categories=Game;
          ENTRY
          chmod 644 "$DESKTOP_FILE"
          printf 'Acceso creado: %s\\n' "$DESKTOP_FILE"
          DESKTOP_INSTALLER
          chmod +x "$DIR/instalar-acceso-escritorio.sh"
          cat > "$DIR/LEEME.txt" <<'README'
          Negative Launcher 0.1.1 — Linux

          INICIO
          1. Extrae el paquete completo en una carpeta permanente.
          2. Ejecuta iniciar-negative-launcher.sh desde el gestor de archivos
             o desde una terminal.
          3. No muevas el ejecutable fuera de esta carpeta: necesita los archivos
             de runtime y recursos que lo acompañan.
          4. Opcional: ejecuta instalar-acceso-escritorio.sh para crear un acceso
             en el menú de aplicaciones de tu escritorio Linux.

          Si no abre, ejecútalo desde una terminal para ver el mensaje de error.
          En distribuciones mínimas puede ser necesario instalar las bibliotecas
          gráficas del sistema requeridas por Avalonia.

          Este paquete es una compilación de desarrollo. La publicación correcta
          confirma que el artefacto se generó, no que todas las funciones hayan
          sido validadas en equipos Linux reales.
          README
          sh -n "$DIR/iniciar-negative-launcher.sh"
          sh -n "$DIR/instalar-acceso-escritorio.sh"
          TEST_HOME="$RUNNER_TEMP/negative-launcher-home"
          TEST_DIR="$RUNNER_TEMP/Negative Launcher test"
          mkdir -p "$TEST_HOME" "$TEST_DIR/Assets"
          cp "$DIR/instalar-acceso-escritorio.sh" "$TEST_DIR/"
          cp "$DIR/iniciar-negative-launcher.sh" "$TEST_DIR/"
          test -s "$DIR/Assets/negativeclient_logo.png"
          cp "$DIR/Assets/negativeclient_logo.png" "$TEST_DIR/Assets/"
          cat > "$TEST_DIR/NegativeLauncher.AvaloniaPrototype" <<'LAUNCHER_STUB'
          #!/usr/bin/env sh
          printf '%s\n' "$@" > "$NEGATIVE_LAUNCHER_TEST_ARGS"
          LAUNCHER_STUB
          chmod +x "$TEST_DIR/NegativeLauncher.AvaloniaPrototype"
          NEGATIVE_LAUNCHER_TEST_ARGS="$TEST_HOME/argumentos.txt" "$TEST_DIR/iniciar-negative-launcher.sh" "argumento con espacios" "segundo"
          grep -Fx "argumento con espacios" "$TEST_HOME/argumentos.txt"
          grep -Fx "segundo" "$TEST_HOME/argumentos.txt"
          HOME="$TEST_HOME" XDG_DATA_HOME="$TEST_HOME/.local/share" "$TEST_DIR/instalar-acceso-escritorio.sh"
          grep -F "Exec=\"$TEST_DIR/iniciar-negative-launcher.sh\"" "$TEST_HOME/.local/share/applications/negative-launcher.desktop"
          grep -Fx "Icon=negative-launcher" "$TEST_HOME/.local/share/applications/negative-launcher.desktop"
          test -s "$TEST_HOME/.local/share/icons/hicolor/256x256/apps/negative-launcher.png"
          ARCHIVE="./publicacion/NegativeLauncher-${{ matrix.rid }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$DIR" .
          tar -tzf "$ARCHIVE" > "$RUNNER_TEMP/negative-launcher-linux-archive-list.txt"
          grep -Fq "iniciar-negative-launcher.sh" "$RUNNER_TEMP/negative-launcher-linux-archive-list.txt"
          grep -Fq "instalar-acceso-escritorio.sh" "$RUNNER_TEMP/negative-launcher-linux-archive-list.txt"
          grep -Fq "NegativeLauncher.AvaloniaPrototype" "$RUNNER_TEMP/negative-launcher-linux-archive-list.txt"

      - name: Crear bundle de macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="./publicacion/NegativeLauncher-${{ matrix.rid }}.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R "./publicacion/${{ matrix.rid }}/." "$APP/Contents/MacOS/"
          EXECUTABLE="$APP/Contents/MacOS/NegativeLauncher.AvaloniaPrototype"
          test -f "$EXECUTABLE"
          chmod +x "$EXECUTABLE"

          ICON_SOURCE="$APP/Contents/MacOS/Assets/negativeclient_logo.png"
          test -s "$ICON_SOURCE"
          ICONSET="$RUNNER_TEMP/negativeclient.iconset"
          mkdir -p "$ICONSET"
          sips -z 16 16 "$ICON_SOURCE" --out "$ICONSET/icon_16x16.png" >/dev/null
          sips -z 32 32 "$ICON_SOURCE" --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 "$ICON_SOURCE" --out "$ICONSET/icon_32x32.png" >/dev/null
          sips -z 64 64 "$ICON_SOURCE" --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 "$ICON_SOURCE" --out "$ICONSET/icon_128x128.png" >/dev/null
          sips -z 256 256 "$ICON_SOURCE" --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 "$ICON_SOURCE" --out "$ICONSET/icon_256x256.png" >/dev/null
          sips -z 512 512 "$ICON_SOURCE" --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 "$ICON_SOURCE" --out "$ICONSET/icon_512x512.png" >/dev/null
          sips -z 1024 1024 "$ICON_SOURCE" --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/negativeclient.icns"
          test -s "$APP/Contents/Resources/negativeclient.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Negative Launcher</string>
            <key>CFBundleDisplayName</key><string>Negative Launcher</string>
            <key>CFBundleIdentifier</key><string>com.negativestudios.launcher</string>
            <key>CFBundleVersion</key><string>0.1.1</string>
            <key>CFBundleShortVersionString</key><string>0.1.1</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>NegativeLauncher.AvaloniaPrototype</string>
            <key>CFBundleIconFile</key><string>negativeclient.icns</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          test -x "$EXECUTABLE"
          test -f "$APP/Contents/MacOS/NegativeLauncher.AvaloniaPrototype.dll"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "./publicacion/NegativeLauncher-${{ matrix.rid }}.zip"
          unzip -l "./publicacion/NegativeLauncher-${{ matrix.rid }}.zip" > "$RUNNER_TEMP/negative-launcher-macos-archive-list.txt"
          grep -Fq "Contents/Info.plist" "$RUNNER_TEMP/negative-launcher-macos-archive-list.txt"
          grep -Fq "Contents/Resources/negativeclient.icns" "$RUNNER_TEMP/negative-launcher-macos-archive-list.txt"
          grep -Fq "Contents/MacOS/NegativeLauncher.AvaloniaPrototype" "$RUNNER_TEMP/negative-launcher-macos-archive-list.txt"
          grep -Fq "CFBundleIconFile" "$APP/Contents/Info.plist"

          # El ZIP conserva el bundle y el DMG ofrece el formato de instalación habitual de macOS.
          DMG_STAGE="$RUNNER_TEMP/NegativeLauncher-${{ matrix.rid }}-dmg"
          mkdir -p "$DMG_STAGE"
          ditto "$APP" "$DMG_STAGE/Negative Launcher.app"
          # Atajo estándar que permite arrastrar la aplicación a /Applications desde Finder.
          ln -s /Applications "$DMG_STAGE/Applications"
          cat > "$DMG_STAGE/LEEME.txt" <<'MACREADME'
          Negative Launcher 0.1.1 — macOS

          INSTALACIÓN
          1. Arrastra "Negative Launcher.app" al acceso "Applications" de la imagen
             o a tu carpeta Aplicaciones.
          2. Abre la aplicación desde Aplicaciones.
          3. Si Gatekeeper muestra una advertencia porque la aplicación no está
             firmada ni notarizada, confirma el origen del archivo antes de autorizarla.
          4. Conserva la aplicación completa dentro de su carpeta; no separes el
             ejecutable de los archivos incluidos en el bundle.

          La publicación automática confirma compilación y pruebas de CI; no reemplaza
          la validación interactiva de inicio de sesión Microsoft ni de Minecraft.
          MACREADME

          DMG="./publicacion/NegativeLauncher-${{ matrix.rid }}.dmg"
          hdiutil create -volname "Negative Launcher" -srcfolder "$DMG_STAGE" -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"
          MOUNT_POINT="$RUNNER_TEMP/negative-launcher-dmg-check"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_POINT"
          test -s "$MOUNT_POINT/Negative Launcher.app/Contents/Info.plist"
          test -s "$MOUNT_POINT/LEEME.txt"
          test -L "$MOUNT_POINT/Applications"
          test "$(readlink "$MOUNT_POINT/Applications")" = "/Applications"
          hdiutil detach "$MOUNT_POINT" -quiet

      - name: Guardar artefacto de la plataforma
        uses: actions/upload-artifact@v4
        with:
          name: NegativeLauncher-${{ matrix.rid }}
          path: ./publicacion/NegativeLauncher-${{ matrix.rid }}.*
          if-no-files-found: error
          retention-days: 14

  validar-flujo-de-publicacion:
    name: Validar sintaxis del flujo de release
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Go para actionlint
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Instalar actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Validar workflows de compilación y publicación
        run: '"$HOME/go/bin/actionlint" .github/workflows/compilar-prototipo-multiplataforma.yml .github/workflows/publicar-release-multiplataforma.yml'

  probar-logica-compartida:
    name: Probar lógica compartida (${{ matrix.sistema }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: Windows
            runner: windows-latest
          - sistema: Linux
            runner: ubuntu-latest
          - sistema: macOS
            runner: macos-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Ejecutar pruebas de lógica compartida
        run: dotnet run --project "NegativeLauncher.Core.Tests/NegativeLauncher.Core.Tests.csproj" --configuration Release
