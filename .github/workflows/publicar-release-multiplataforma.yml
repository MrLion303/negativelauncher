name: Publicar release Linux y macOS

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "ID de una ejecución exitosa de Compilar Negative Launcher para Linux y macOS"
        required: true
        type: string
      tag_name:
        description: "Etiqueta de versión, por ejemplo v0.1.1 (debe coincidir con <Version> del proyecto)"
        required: true
        default: "v0.1.1"
        type: string
      prerelease:
        description: "Publicar como versión preliminar (no será la release estable más reciente)"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: publicar-release-linux-macos
  cancel-in-progress: false

jobs:
  publicar:
    name: Validar y publicar los dos paquetes universales
    runs-on: ubuntu-latest
    steps:
      - name: Validar ejecución de origen y etiqueta
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "source_run_id debe ser un ID numérico de GitHub Actions." >&2
            exit 1
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "La etiqueta debe usar una versión estable, por ejemplo v0.1.1." >&2
            exit 1
          fi

          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          SOURCE_PATH="$(jq -r '.path // ""' <<< "$RUN_JSON")"
          SOURCE_BRANCH="$(jq -r '.head_branch // ""' <<< "$RUN_JSON")"
          SOURCE_CONCLUSION="$(jq -r '.conclusion // ""' <<< "$RUN_JSON")"
          SOURCE_SHA="$(jq -r '.head_sha // ""' <<< "$RUN_JSON")"

          if [[ "$SOURCE_PATH" != .github/workflows/compilar-prototipo-multiplataforma.yml* ]]; then
            echo "La ejecución indicada no corresponde al flujo de compilación multiplataforma." >&2
            exit 1
          fi

          if [[ "$SOURCE_BRANCH" != "portabilidad-fiel-0.1.1" ]]; then
            echo "El paquete debe proceder de la rama portabilidad-fiel-0.1.1." >&2
            exit 1
          fi

          if [[ "$SOURCE_CONCLUSION" != "success" || -z "$SOURCE_SHA" ]]; then
            echo "Solo pueden publicarse ejecuciones completadas correctamente." >&2
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "La etiqueta $TAG_NAME ya existe. No se sobrescribirá un release existente." >&2
            exit 1
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Validada la ejecución $SOURCE_RUN_ID sobre $SOURCE_SHA."

      - name: Obtener el código exacto del build validado
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Verificar que la etiqueta coincide con la versión compilada
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(sed -n 's/^[[:space:]]*<Version>\(.*\)<\/Version>[[:space:]]*$/\1/p' "Prototipo Avalonia/NegativeLauncher.AvaloniaPrototype.csproj" | head -n 1)"
          RELEASE_VERSION="${TAG_NAME#v}"

          if [[ -z "$PROJECT_VERSION" || "$PROJECT_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Etiqueta $TAG_NAME no coincide con la versión compilada '$PROJECT_VERSION'." >&2
            echo "Cambia <Version> en el proyecto y vuelve a compilar antes de publicar." >&2
            exit 1
          fi

          echo "Versión compilada validada: $PROJECT_VERSION."

      - name: Descargar artefacto Linux universal
        uses: actions/download-artifact@v4
        with:
          name: NegativeLauncher-Linux
          path: release-assets/linux
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar artefacto macOS universal
        uses: actions/download-artifact@v4
        with:
          name: NegativeLauncher-macOS
          path: release-assets/macos
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validar contenido y calcular SHA-256 de ambos paquetes
        shell: bash
        run: |
          set -euo pipefail
          LINUX_ASSET="release-assets/linux/NegativeLauncher-linux-universal.tar.gz"
          MACOS_ASSET="release-assets/macos/NegativeLauncher-macos-universal.zip"
          test -s "$LINUX_ASSET"
          test -s "$MACOS_ASSET"

          tar -tzf "$LINUX_ASSET" > release-assets/linux-contenido.txt
          grep -Fq "linux-x64/NegativeLauncher.AvaloniaPrototype" release-assets/linux-contenido.txt
          grep -Fq "linux-arm64/NegativeLauncher.AvaloniaPrototype" release-assets/linux-contenido.txt
          grep -Fq "iniciar-negative-launcher.sh" release-assets/linux-contenido.txt

          unzip -t "$MACOS_ASSET"
          unzip -Z1 "$MACOS_ASSET" > release-assets/macos-contenido.txt
          grep -Fq "NegativeLauncher-macos-universal.app/Contents/Info.plist" release-assets/macos-contenido.txt
          grep -Fq "NegativeLauncher-macos-universal.app/Contents/MacOS/NegativeLauncher.AvaloniaPrototype" release-assets/macos-contenido.txt

          sha256sum "$LINUX_ASSET" "$MACOS_ASSET"

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Negative Launcher ${{ inputs.tag_name }}
          target_commitish: ${{ steps.validate.outputs.source_sha }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.prerelease == false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Negative Launcher para Linux x64/ARM64 y macOS Intel/Apple Silicon.

            La descarga Linux es un solo paquete que selecciona la arquitectura automáticamente. La descarga de macOS es una app universal con ambas arquitecturas.

            La app de macOS se firma ad hoc para validar el paquete. Esta compilación no lleva certificado Developer ID ni notarización de Apple; antes de distribuirla públicamente se debe validar el inicio en un Mac real y completar la firma y notarización.

            La publicación confirma que los paquetes se compilaron y superaron las pruebas automatizadas de la ejecución de origen. El inicio de sesión Microsoft y el lanzamiento de Minecraft con una cuenta real aún requieren prueba interactiva.
          files: |
            release-assets/linux/NegativeLauncher-linux-universal.tar.gz
            release-assets/macos/NegativeLauncher-macos-universal.zip
